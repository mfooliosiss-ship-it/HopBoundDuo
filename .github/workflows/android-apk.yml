name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          curl -L --fail -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

          curl -L --fail -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and strictly validate project
        shell: bash
        run: |
          ./godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error" godot-import.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/HopBoundDuo.apk 2>&1 | tee godot-apk.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error|Project export .* failed" godot-apk.log; then
            echo "APK export validation failed."
            exit 1
          fi
          test -f build/HopBoundDuo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HopBoundDuo-APK
          path: build/HopBoundDuo.apk
          if-no-files-found: error

      - name: Install Gradle template and export debug AAB
        shell: bash
        run: |
          ./godot --headless --path . --install-android-build-template --export-debug "Android AAB" build/HopBoundDuo-debug.aab 2>&1 | tee godot-aab.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error|Project export .* failed" godot-aab.log; then
            echo "AAB export validation failed."
            exit 1
          fi
          test -f build/HopBoundDuo-debug.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HopBoundDuo-AAB
          path: build/HopBoundDuo-debug.aab
          if-no-files-found: error
