name: Repair V2 Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch exact GDScript type errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/game_v2.gd')
          s = p.read_text()
          replacements = {
              'var delta_pos := event.position - swipe_start': 'var delta_pos: Vector2 = event.position - swipe_start',
              'var wheel_x := sx * (1.6 if truck else 1.0)': 'var wheel_x: float = float(sx) * (1.6 if truck else 1.0)',
              'var slot := (peer_id - 1) % 4': 'var slot: int = (peer_id - 1) % 4',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "HopBoundDuo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/game_v2.gd
          git commit -m "Fix V2 GDScript type inference errors [skip ci]"
          git push
